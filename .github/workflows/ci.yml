name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['lts/-1', 'lts/*', 'latest']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # --ignore-scripts skips the `prepare` build; we run it explicitly below.
      # esbuild's platform binary is an optionalDependency, so it still installs.
      - name: Install dependencies
        run: npm ci --ignore-scripts
        timeout-minutes: 10

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit + integration tests (with coverage)
        run: npm run test:coverage

      - name: Smoke test (build the fixtures via the packaged CLI)
        run: |
          node dist/cli.js build test/fixtures -o /tmp/out
          test -f /tmp/out/index.html
          test -f /tmp/out/mdgarden.client.js
          test -f /tmp/out/katex/katex.min.css

      - name: Upload coverage report
        if: matrix.node-version == 'lts/*'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  verify-binary:
    name: Verify Standalone Binary Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build standalone binary
        run: npm run build:binary

      - name: Test standalone binary executable
        shell: bash
        run: |
          if [ -f "build/mdgarden" ]; then
            ./build/mdgarden --version
          elif [ -f "build/mdgarden.exe" ]; then
            ./build/mdgarden.exe --version
          else
            echo "Binary output not found in build/"
            exit 1
          fi

  verify-package:
    name: Verify NPM Packaging Dry-Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check package tarball
        run: npm run pack:check
