name: Release mdgarden CLI

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Determine Version
        id: meta
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          ZIP_NAME="mdgarden-${VERSION}.zip"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Package Dist & Compute SHA-256
        run: |
          ZIP_FILE="${{ steps.meta.outputs.zip_name }}"
          if [ -d "dist" ]; then
            zip -r "$ZIP_FILE" dist/ package.json README.md LICENSE -x "*.DS_Store"
          else
            zip -r "$ZIP_FILE" bin/ package.json README.md LICENSE -x "*.DS_Store"
          fi

          sha256sum "$ZIP_FILE" > "${ZIP_FILE}.sha256"

      - name: Attest Build Provenance (Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ steps.meta.outputs.zip_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.meta.outputs.zip_name }}
            ${{ steps.meta.outputs.zip_name }}.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
